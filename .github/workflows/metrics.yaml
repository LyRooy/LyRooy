name: Update Language Analytics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: stats/languages.svg
          base: ""
          # Ograniczenie wyłącznie do Twoich własnych repozytoriów oraz tych, gdzie faktycznie masz commity
          repositories_affiliations: owner, collaborator
          # Włączenie pluginu śledzącego realne linie kodu napisane przez Ciebie w commitach
          plugin_lines: yes
          plugin_lines_repositories_limit: 30
          plugin_lines_history_limit: 100
          # Konfiguracja języków bazująca na Twoim faktycznym wkładzie, a nie wadze całego repo
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_skipped: matuszen/Rektor-jest-super
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_other: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: "0%"
          config_timezone: Europe/Warsaw
