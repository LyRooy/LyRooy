name: Update Language Analytics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: stats/donut_by_repos.svg # Generuje plik SVG pod wskazaną ścieżką
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_other: yes
          plugin_languages_limit: 8
          config_timezone: Europe/Warsaw
          # Stylizacja na ciemny motyw i wykres kołowy
          config_order: base.metadata, plugin.languages
          style: eggenschwiler # Przejrzysty styl z donutem / statystykami
