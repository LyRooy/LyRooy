name: Generate Language Metrics
on:
  schedule: [{cron: "0 0 * * *"}] # Odpala się raz dziennie
  workflow_dispatch: # Pozwala odpalić ręcznie z zakładki Actions
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }} # Wymaga dodania tokenu PAT w ustawieniach repo
          filename: profile/languages.svg # Zapisze plik obok streak.svg
          base: "" # Wyłącza domyślne statystyki (chcemy same języki)
          plugin_languages: yes
          plugin_languages_ignored: html, css # Ignoruje znaczniki (opcjonalne)
          plugin_languages_details: percentage
          config_timezone: Europe/Warsaw
